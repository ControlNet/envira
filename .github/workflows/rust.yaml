name: Rust CLI

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'src/**'
      - 'catalog/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tests/integration/**'
      - 'verify.sh'
      - 'pyproject.toml'
      - 'envira.sh'
      - '.github/workflows/rust.yaml'
      - '.github/workflows/build.yaml'
  pull_request:
    paths:
      - 'src/**'
      - 'catalog/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tests/integration/**'
      - 'verify.sh'
      - 'pyproject.toml'
      - 'envira.sh'
      - '.github/workflows/rust.yaml'
      - '.github/workflows/build.yaml'
  workflow_dispatch:
  # release.yaml runs the same checks and uses the dist artifacts.
  workflow_call:

# A newer push to the same branch or PR cancels the run still going for the older one.
concurrency:
  group: rust-cli-${{ github.ref }}
  cancel-in-progress: true

# The job token only needs to read; it is passed into the test containers to raise the
# GitHub API rate limit of release downloads and latest-version queries.
permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Apple Silicon: lints and unit tests, then installs on the runner itself (no containers on
  # macOS; each job gets a fresh VM).
  macos:
    name: macOS (aarch64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Read-only commands
        env:
          ENVIRA_NO_REMOTE: '1'
        run: |
          e=target/release/envira
          $e --version
          $e doctor
          $e catalog check
          $e status | tail -n 3
      - name: Install, adopt and shell integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tests/integration/macos.sh

  # The static release binaries and wheels (x86_64, aarch64).
  dist:
    uses: ./.github/workflows/build.yaml

  # envira.sh against the fresh build: installs and runs it, and refuses a tampered binary.
  bootstrap:
    needs: dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-x86_64
          path: site
      - name: Install with envira.sh
        run: |
          python3 -m http.server -d site -b 127.0.0.1 8000 >/dev/null 2>&1 &
          for _ in $(seq 50); do curl -fsI http://127.0.0.1:8000/envira-x86_64-linux >/dev/null && break; sleep 0.2; done
          HOME=$(mktemp -d)
          export HOME ENVIRA_BASE_URL=http://127.0.0.1:8000
          # No terminal here: it installs and does not open envira.
          bash envira.sh </dev/null
          "$HOME/.local/bin/envira" --version
          # As `curl … | bash -s -- ARGS`: the arguments go to envira.
          cat envira.sh | bash -s -- --no-remote status | tail -n 1
          echo tampered >> site/envira-x86_64-linux
          if ENVIRA_INSTALL_DIR="$HOME/tampered" bash envira.sh; then echo "a tampered binary was installed"; exit 1; fi
          test ! -e "$HOME/tampered/envira"

  # One release build for every integration job; they do not wait for the lints.
  build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: envira
          path: target/release/envira
          retention-days: 1

  integration:
    name: ${{ matrix.distro }} ${{ matrix.suite }} ${{ matrix.mode }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, fedora, arch, opensuse]
        suite: [check, full]
        mode: [sudo, user]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: envira
          path: bin
      - run: chmod +x bin/envira
      - name: Run the ${{ matrix.suite }} suite in a ${{ matrix.distro }} container
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISTRO: ${{ matrix.distro }}
          SUITE: ${{ matrix.suite }}
          MODES: ${{ matrix.mode }}
          ENVIRA_BIN: bin/envira
        run: tests/integration/run.sh
