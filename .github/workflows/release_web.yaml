name: Release Web

on:
  workflow_call:
    secrets:
      DEPLOY_PRIVATE:
        required: true

jobs:
  release-web:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Prepare folder
      run: |
        mkdir -p ~/dist
        mkdir -p ~/dist/user
        mkdir -p ~/dist/envira
        mv files ~/dist/files

    # Only the catalog comes from this run's build (the x86_64 dist artifact).
    - name: Download the catalog
      uses: actions/download-artifact@v4
      with:
        name: dist-x86_64
        path: ~/artifacts

    # files/envira-<arch>-<os>(.sha256): mirrors of a release's binaries, this tag's or, on other
    # pushes, the latest release's, so a push to main never publishes an unreleased build.
    # files/envira: the x86_64 Linux binary under the name the first envira.sh downloaded.
    - name: Release binaries
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag=""
        case "$GITHUB_REF" in refs/tags/v*) tag="$GITHUB_REF_NAME" ;; esac
        # $tag unquoted: empty means the latest release.
        if gh release download $tag --repo "$GITHUB_REPOSITORY" --pattern 'envira-*' --dir ~/release; then
          mv ~/release/envira-* ~/dist/files/
          cp ~/dist/files/envira-x86_64-linux ~/dist/files/envira
        else
          echo "::warning::no GitHub release ${tag:-yet}; files/ has no envira binaries"
        fi

    # envira/catalog.toml: the catalog every envira fetches.
    - name: Clean files
      run: |
        mv run.sh ~/dist/index.html
        mv run_user.sh ~/dist/user/index.html
        mv verify.sh ~/dist/verify.html
        mv envira.sh ~/dist/envira/index.html
        mv ~/artifacts/catalog.toml ~/dist/envira/catalog.toml
        echo "boot.controlnet.space" > ~/dist/CNAME
        ls -lR ~/dist/files ~/dist/envira

    - name: Init git and commit
      env:
        DEPLOY_PRIVATE: ${{ secrets.DEPLOY_PRIVATE }}
      run: |
        mkdir -p ~/.ssh/
        echo "$DEPLOY_PRIVATE" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan github.com >> ~/.ssh/known_hosts
        git config --global user.email "smczx@hotmail.com"
        git config --global user.name "ControlNet"
        cd ~/dist
        git init
        git add -A
        git commit -m "update"
        git remote add origin-ssh git@github.com:ControlNet/envira.git

    - name: Push
      run: |
        git push origin-ssh HEAD:dist -f
      working-directory: /home/runner/dist/
