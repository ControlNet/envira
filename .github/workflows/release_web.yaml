name: Release Web

on:
  workflow_call:
    secrets:
      DEPLOY_PRIVATE:
        required: true

jobs:
  release-web:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Prepare folder
      run: |
        mkdir -p ~/dist
        mkdir -p ~/dist/user
        mkdir -p ~/dist/envira
        mv files ~/dist/files

    - name: Download the dist build
      uses: actions/download-artifact@v4
      with:
        pattern: dist-*
        merge-multiple: true
        path: ~/artifacts

    # files/envira-<arch>-<os>(.sha256): dev builds of this push (releases are on GitHub, which
    # envira.sh installs from); files/envira: the x86_64 Linux build under the name the first
    # envira.sh downloaded; envira/catalog.toml: the catalog every envira fetches.
    - name: Clean files
      run: |
        mv run.sh ~/dist/index.html
        mv run_user.sh ~/dist/user/index.html
        mv verify.sh ~/dist/verify.html
        mv envira.sh ~/dist/envira/index.html
        mv ~/artifacts/envira-*-linux ~/artifacts/envira-*-linux.sha256 ~/dist/files/
        mv ~/artifacts/envira-*-macos ~/artifacts/envira-*-macos.sha256 ~/dist/files/
        cp ~/dist/files/envira-x86_64-linux ~/dist/files/envira
        mv ~/artifacts/catalog.toml ~/dist/envira/catalog.toml
        echo "boot.controlnet.space" > ~/dist/CNAME
        ls -lR ~/dist/files ~/dist/envira

    # Released envira read this catalog within the hour: the latest release must load it, unless
    # its min_envira is newer. Nothing to check before the first release.
    - name: The latest release can use the catalog
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        latest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
          --limit 1 --json tagName --jq '.[0].tagName // ""')
        if [ -z "$latest" ]; then
          echo "::notice::no GitHub release yet; the catalog is not checked against one"
          exit 0
        fi
        gh release download "$latest" --repo "$GITHUB_REPOSITORY" --pattern envira-x86_64-linux --dir ~/released
        chmod 755 ~/released/envira-x86_64-linux
        bash tests/catalog-compat.sh ~/released/envira-x86_64-linux ~/dist/envira/catalog.toml

    - name: Init git and commit
      env:
        DEPLOY_PRIVATE: ${{ secrets.DEPLOY_PRIVATE }}
      run: |
        mkdir -p ~/.ssh/
        echo "$DEPLOY_PRIVATE" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan github.com >> ~/.ssh/known_hosts
        git config --global user.email "smczx@hotmail.com"
        git config --global user.name "ControlNet"
        cd ~/dist
        git init
        git add -A
        git commit -m "update"
        git remote add origin-ssh git@github.com:ControlNet/envira.git

    - name: Push
      run: |
        git push origin-ssh HEAD:dist -f
      working-directory: /home/runner/dist/
