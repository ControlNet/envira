name: Lagacy Test
# The legacy scripts install from upstream, so they also run weekly to catch breakage that
# comes without a change here.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths:
      - 'run.sh'
      - 'run_user.sh'
      - 'verify.sh'
      - '.github/integration-test/**'
      - '.github/workflows/lagacy_test.yaml'
  pull_request:
    paths:
      - 'run.sh'
      - 'run_user.sh'
      - 'verify.sh'
      - '.github/integration-test/**'
      - '.github/workflows/lagacy_test.yaml'
        
concurrency:
  group: lagacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu22.04, ubuntu24.04, ubuntu26.04, fedora, manjaro, arch]
        mode: [sudo, user]
    name: ${{ matrix.os }} ${{ matrix.mode }} test
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build docker image
        run: docker build -f .github/integration-test/Dockerfile-${{ matrix.os }}-${{ matrix.mode }} -t test_os .
      
      - name: Run installer and verification
        env:
          CARGO_HTTP_MULTIPLEXING: "false"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          script="run.sh"
          if [ "${{ matrix.mode }}" = "user" ]; then
            script="run_user.sh"
          fi

          docker run --rm --privileged=true \
            -e CARGO_HTTP_MULTIPLEXING \
            -e GITHUB_TOKEN \
            -e HOME=/home/user \
            -w /home/user \
            -v "$PWD:/workspace" \
            test_os \
            bash -lc "bash \"$script\" && bash /workspace/verify.sh"
