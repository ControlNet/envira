name: Release to PyPI

# A push to main deploys boot.controlnet.space (scripts, catalog.toml, binaries). A `v*` tag also
# publishes the wheels (Linux x86_64 / aarch64, macOS arm64) to PyPI, the crate to crates.io, and
# creates the GitHub release that envira.sh and cargo binstall install from; its version must match
# Cargo.toml. Trusted publishing is bound to the workflow file name, and on PyPI also to the
# `pypi` / `testpypi` environments.
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    # Pushes that change only these deploy nothing new; tag pushes ignore path filters.
    paths-ignore:
      - '**.md'
      - '.omo/**'
      - 'assets/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Upload to Test PyPI instead of PyPI'
        required: false
        default: false
        type: boolean

# A newer push to main cancels the older run, deploy included, so an older run never deploys
# after tests it did not finish. Tag runs publish and are never cancelled. The group differs from
# rust.yaml's, which this workflow calls.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

# The legacy scripts (run.sh, run_user.sh) are tested by lagacy_test.yaml when they change.
jobs:
  test:
    uses: ./.github/workflows/test.yaml

  # fmt, clippy, unit and integration tests, and the dist build (binaries, wheels, catalog.toml).
  rust:
    uses: ./.github/workflows/rust.yaml

  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches Cargo.toml
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "${GITHUB_REF_NAME#v}" != "$cargo_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi

  publish:
    # Tags and manual runs; `version` is skipped on manual runs.
    if: ${{ !cancelled() && !failure() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [test, rust, version]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.test_pypi == 'true' && 'testpypi' || 'pypi' }}
      url: ${{ github.event.inputs.test_pypi == 'true' && 'https://test.pypi.org/p/envira' || 'https://pypi.org/p/envira' }}
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Keep only the wheels
        run: mkdir wheels && mv dist/*.whl wheels/ && ls -l wheels

      - name: Publish to Test PyPI
        if: github.event.inputs.test_pypi == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels/
          repository-url: https://test.pypi.org/legacy/
          verbose: true

      - name: Publish to PyPI
        if: github.event.inputs.test_pypi != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels/
          verbose: true

  # crates.io: trusted publishing (OIDC). A crate's first version cannot use it, so the
  # CARGO_REGISTRY_TOKEN secret, when set, is used instead; a version already there is skipped.
  # Manual runs only check the package (`--dry-run`).
  crates:
    if: ${{ !cancelled() && !failure() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [test, rust, version]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Dry run
        if: github.event_name == 'workflow_dispatch'
        run: cargo publish --locked --dry-run

      - name: Already on crates.io?
        id: exists
        if: github.event_name != 'workflow_dispatch'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'envira-release (github.com/ControlNet/envira)' \
            "https://crates.io/api/v1/crates/envira/${GITHUB_REF_NAME#v}")
          echo "skip=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Trusted publishing token
        id: auth
        if: github.event_name != 'workflow_dispatch' && steps.exists.outputs.skip != 'true' && env.CARGO_REGISTRY_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        if: github.event_name != 'workflow_dispatch' && steps.exists.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  release:
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [rust, version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # IMPORTANT: this permission is mandatory for creating releases
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/envira-*-linux
            dist/envira-*-linux.sha256
            dist/envira-*-macos
            dist/envira-*-macos.sha256
            dist/catalog.toml

  # Only after every test passed: a cancelled test job is neither cancelled() nor failure() here.
  release-web:
    if: ${{ github.event_name == 'push' && needs.test.result == 'success' && needs.rust.result == 'success' }}
    needs: [test, rust]
    uses: ./.github/workflows/release_web.yaml
    secrets:
      DEPLOY_PRIVATE: ${{ secrets.DEPLOY_PRIVATE }}

  verify:
    if: ${{ !cancelled() && !failure() && github.event.inputs.test_pypi != 'true' && startsWith(github.ref, 'refs/tags/v') }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Wait for PyPI to update
        run: sleep 60

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install from PyPI and run
        run: |
          pip install "envira==${GITHUB_REF_NAME#v}"
          envira --version
          envira --no-remote catalog check

  # From crates.io: compiled from source, and through cargo binstall, which takes the release binary.
  verify-crate:
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [crates, release]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: cargo-bins/cargo-binstall@main

      - name: cargo binstall (release binary)
        env:
          # binstall looks the release up through the GitHub API; anonymous calls from shared
          # runner IPs get 403 (rate limit).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          for i in 1 2 3 4 5; do
            cargo binstall -y --strategies crate-meta-data "envira@$v" && break
            [ "$i" = 5 ] && exit 1
            sleep 30
          done
          envira --version | grep -F "$v"
          envira --no-remote catalog check

      - name: cargo install (from source)
        if: runner.os == 'Linux'
        run: |
          cargo install --locked --force --version "${GITHUB_REF_NAME#v}" envira
          envira --version
