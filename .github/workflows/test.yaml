name: Test

# Checks on the legacy scripts and workflows (standard library only).
on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run tests
        run: python -m unittest discover -v test
