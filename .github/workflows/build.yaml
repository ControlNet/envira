name: Build

# Static (musl) release binaries and the PyPI wheels that carry them, for x86_64 and aarch64
# Linux, plus the Apple Silicon binary and wheel.
# Called by rust.yaml on every push and by release.yaml for a release.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  dist:
    name: dist ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .cache/cargo-registry
            .cache/target
          key: dist-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: dist-${{ matrix.arch }}-
      # Alpine is musl-native: the binary is static and runs on any glibc or musl Linux. One
      # compile gives both the wheel (tagged for glibc and musl, as uv's are) and the binary.
      - name: Build in Alpine
        run: |
          mkdir -p .cache/cargo-registry .cache/target dist
          docker run --rm -v "$PWD:/src" -v "$PWD/.cache/cargo-registry:/usr/local/cargo/registry" \
            -e CARGO_TARGET_DIR=/src/.cache/target -w /src rust:1.93-alpine sh -euc '
              apk add -q musl-dev cmake make perl gcc g++ python3
              python3 -m venv /tmp/v && /tmp/v/bin/pip install -q "maturin>=1.9,<2"
              /tmp/v/bin/maturin build --release --locked --compatibility manylinux_2_17 musllinux_1_1 -o dist
              cp .cache/target/release/envira dist/envira-${{ matrix.arch }}-linux'
          sudo chown -R "$(id -u):$(id -g)" dist .cache
      - name: Check and checksum
        working-directory: dist
        run: |
          # x86_64 links static-pie, aarch64 plain static; neither needs a libc on the machine.
          file envira-${{ matrix.arch }}-linux | tee /dev/stderr | grep -Eq 'static(-pie|ally) linked'
          ./envira-${{ matrix.arch }}-linux --version
          ./envira-${{ matrix.arch }}-linux --no-remote catalog check
          sha256sum envira-${{ matrix.arch }}-linux > envira-${{ matrix.arch }}-linux.sha256
      # The catalog the binaries fetch (boot.controlnet.space/envira/catalog.toml).
      - name: Published catalog
        if: matrix.arch == 'x86_64'
        working-directory: dist
        run: |
          { echo "# Generated by \`envira catalog show\` from catalog/*.toml; edit those instead."
            ./envira-x86_64-linux --no-remote --no-overlay catalog show; } > catalog.toml
          ./envira-x86_64-linux --no-overlay --catalog catalog.toml catalog check
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/
          retention-days: 7

  # Apple Silicon: no static linking on macOS, but the binary only links system libraries
  # (libSystem, Security), which every Mac has. Built natively on the runner.
  dist-macos:
    name: dist aarch64 (macOS)
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          python3 -m venv /tmp/v && /tmp/v/bin/pip install -q "maturin>=1.9,<2"
          /tmp/v/bin/maturin build --release --locked -o dist
          cp target/release/envira dist/envira-aarch64-macos
      - name: Check and checksum
        working-directory: dist
        run: |
          file envira-aarch64-macos | tee /dev/stderr | grep -q 'Mach-O 64-bit executable arm64'
          if otool -L envira-aarch64-macos | tee /dev/stderr | grep -E '/opt/homebrew|/usr/local'; then
            echo "::error::links a library that is not part of macOS"; exit 1
          fi
          ./envira-aarch64-macos --version
          ./envira-aarch64-macos --no-remote catalog check
          shasum -a 256 envira-aarch64-macos > envira-aarch64-macos.sha256
          ls -l
      # envira.sh on the Mac it was built on: installs the fresh build from a local server.
      - name: Install with envira.sh
        run: |
          python3 -m http.server -d dist -b 127.0.0.1 8000 >/dev/null 2>&1 &
          for _ in $(seq 50); do curl -fsI http://127.0.0.1:8000/envira-aarch64-macos >/dev/null && break; sleep 0.2; done
          HOME=$(mktemp -d)
          export HOME ENVIRA_BASE_URL=http://127.0.0.1:8000
          bash envira.sh
          "$HOME/.local/bin/envira" --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist-aarch64-macos
          path: dist/
          retention-days: 7
