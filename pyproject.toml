[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

# The PyPI package carries the Rust binary (like ruff and uv), so `pipx install envira` and
# `uv tool install envira` install the `envira` command. The version comes from Cargo.toml.
[project]
name = "envira"
dynamic = ["version"]
description = "Install, update and track a Linux and macOS toolset from a declarative TOML catalog"
authors = [{name = "ControlNet", email = "smczx@hotmail.com"}]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Rust",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ControlNet/envira"
Repository = "https://github.com/ControlNet/envira"
Issues = "https://github.com/ControlNet/envira/issues"

[tool.maturin]
bindings = "bin"
