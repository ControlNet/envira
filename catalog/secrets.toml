#:schema ./schema.json
# Secrets management.

[tools.infisical]
desc = "Infisical secrets CLI"
install = [{ method = "npm", package = "@infisical/cli", depends = ["nodejs", "npm-prefix"] }]
# Credentials are filled in by the user (e.g. in ~/.zshenv); envira only keeps the names exported.
shell = { env = { INFISICAL_CLIENT_ID = "${INFISICAL_CLIENT_ID:-}", INFISICAL_CLIENT_SECRET = "${INFISICAL_CLIENT_SECRET:-}", INFISICAL_PROJECT_ID = "${INFISICAL_PROJECT_ID:-}" }, init = { zsh = "[ -f \"$HOME/.local/share/infisical/ienv.sh\" ] && . \"$HOME/.local/share/infisical/ienv.sh\"\ncommand -v ienv >/dev/null 2>&1 && ienv --quiet || true" } }

[configs.ienv]
desc = "ienv helper: load Infisical secrets into the shell"
depends = ["infisical"]
check = 'test -s "$HOME/.local/share/infisical/ienv.sh"'
apply = 'mkdir -p "$HOME/.local/share/infisical" && chmod 700 "$HOME/.local/share/infisical" && curl -fsSL https://raw.githubusercontent.com/ControlNet/my-zsh-theme-env/main/files/ienv.sh -o "$HOME/.local/share/infisical/ienv.sh" && chmod 600 "$HOME/.local/share/infisical/ienv.sh"'
revert = 'rm -f "$HOME/.local/share/infisical/ienv.sh"'

[bundles.secrets]
name = "Secrets"
desc = "Infisical CLI and ienv"
items = ["infisical", "ienv"]
