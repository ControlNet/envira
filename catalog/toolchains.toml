#:schema ./schema.json
# Language toolchains and package managers. Other items depend on these explicitly.

[tools.rust-toolchain]
desc = "Rust toolchain via rustup (rustc, cargo)"
depends = ["curl"]
# `rustup check` exits 100 when an update is available. The rustup/cargo proxies are not copied
# into /usr/local/bin (run.sh did): they only work for the user whose ~/.rustup they read.
bins = ["rustup", "rustc", "cargo"]
detect = { cmd = "rustc --version", version = 'rustc (\S+)' }
install = [
  { method = "script", url = "https://sh.rustup.rs", args = ["-y", "--no-modify-path"], update = "rustup update", latest = { cmd = "rustup check || [ $? -eq 100 ]", regex = '(?m)^stable-\S+ - (?:update available: \S+ \([^)]*\) -> |up to date: )(\S+)' } },
]
shell = { path = ["~/.cargo/bin"] }

[tools.cargo-binstall]
desc = "Install prebuilt Rust binaries (used by the cargo method)"
depends = ["rust-toolchain", "curl"]
detect = { cmd = "cargo-binstall -V" }
install = [
  { method = "brew", package = "cargo-binstall", depends = ["homebrew"] },
  { run = "curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash", update = "cargo binstall -y --force cargo-binstall", latest = { http = "https://crates.io/api/v1/crates/cargo-binstall", json = "crate.max_stable_version" } },
]
shell = { env = { BINSTALL_DISABLE_TELEMETRY = "true", BINSTALL_NO_CONFIRM = "true" } }

[tools.cargo-cache]
desc = "Inspect and clean cargo's caches"
detect = { cmd = "cargo-cache --version" }
install = [
  { method = "brew", package = "cargo-cache", depends = ["homebrew"] },
  { method = "cargo", package = "cargo-cache", depends = ["cargo-binstall"], portable = true },
]

[tools.go]
desc = "Go toolchain in ~/.go (GOPATH ~/go)"
depends = ["curl"]
bins = ["go", "gofmt"]
detect = { cmd = "go version", version = 'go(\d\S*)' }
# Same layout as ControlNet/golang-tools-install-script (GOROOT ~/.go), but always the newest
# release and without rc-file edits; the environment comes from `shell`. Updating replaces ~/.go.
install = [{ run = "v=$(curl -fsSL 'https://go.dev/VERSION?m=text' | sed -n 1p) && o=$(uname -s | tr '[:upper:]' '[:lower:]') && a=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/') && curl -fsSL \"https://go.dev/dl/$v.$o-$a.tar.gz\" -o go.tar.gz && rm -rf \"$HOME/.go\" && mkdir -p \"$HOME/.go\" && tar -C \"$HOME/.go\" --strip-components=1 -xzf go.tar.gz", latest = { http = "https://go.dev/VERSION?m=text", regex = 'go(\d\S*)' } }]
shell = { path = ["~/.go/bin", "~/go/bin"], env = { GOROOT = "~/.go", GOPATH = "~/go" } }

[tools.fnm]
desc = "Fast Node.js version manager"
depends = ["unzip", "curl"]
detect = { cmd = "fnm --version", version = 'fnm (\S+)' }
install = [
  { method = "brew", package = "fnm", depends = ["homebrew"] },
  { method = "script", url = "https://fnm.vercel.app/install", shell = "bash", args = ["--skip-shell"], latest = { http = "https://api.github.com/repos/Schniz/fnm/releases/latest", json = "tag_name" } },
]
shell = { path = ["~/.local/share/fnm"], env = { FNM_PATH = "~/.local/share/fnm" }, init = { zsh = "eval \"$(fnm env --shell zsh)\"\neval \"$(fnm completions --shell zsh)\"", bash = 'eval "$(fnm env --shell bash)"' } }

[tools.libatomic]
when = ["os:linux"]
desc = "GNU atomic operations library (Node.js 25+ links against it)"
# A shared library, not an executable: detected through the linker cache.
bins = []
detect = { cmd = "PATH=\"$PATH:/sbin:/usr/sbin\" ldconfig -p | grep -F libatomic.so.1 >/dev/null" }
install = [
  { method = "apt", package = "libatomic1" },
  { method = "dnf", package = "libatomic" },
  { method = "pacman", package = "gcc-libs" },
  { method = "zypper", package = "libatomic1" },
]

[tools.nodejs]
desc = "Node.js LTS managed by fnm (default alias)"
bin = "node"
bins = ["node", "npm"]
depends = ["fnm", "libatomic"]
detect = { cmd = "node --version", version = 'v(\S+)' }
# Updating installs the newest LTS and makes it the default; older versions stay installed.
install = [{ run = "fnm install --lts && fnm default lts-latest", latest = { cmd = "fnm ls-remote --lts | tail -n 1", regex = 'v(\d\S*)' } }]

[configs.npm-prefix]
desc = "Global npm packages in ~/.local (bins in ~/.local/bin, independent of the Node version)"
depends = ["nodejs"]
steps = [{ use = "ini-set", file = "~/.npmrc", section = "", key = "prefix", value = "{home}/.local" }]

[tools.pm2]
desc = "Node.js process manager"
detect = { cmd = "npm ls -g --depth=0 pm2", version = 'pm2@(\S+)' }
install = [{ method = "npm", package = "pm2", depends = ["nodejs", "npm-prefix"] }]

[tools.pipx]
desc = "Install Python applications in isolated environments"
detect = { cmd = "pipx --version", version = '(\S+)' }
install = [
  { method = "brew", package = "pipx", depends = ["homebrew"] },
  { method = "apt", package = "pipx" },
  { method = "dnf", package = "pipx" },
  { method = "pacman", package = "python-pipx" },
  # openSUSE, CentOS and machines without sudo (run.sh / run_user.sh: pip --user).
  { run = "python3 -m pip install --user pipx || python3 -m pip install --user --break-system-packages pipx", update = "python3 -m pip install --user --upgrade pipx || python3 -m pip install --user --upgrade --break-system-packages pipx", depends = ["python3"], latest = { http = "https://pypi.org/pypi/pipx/json", json = "info.version" } },
]

[tools.uv]
desc = "Fast Python package and project manager"
bins = ["uv", "uvx"]
install = [
  { method = "brew", package = "uv", depends = ["homebrew"] },
  { method = "pipx", package = "uv", depends = ["pipx"] },
]

[tools.pixi]
desc = "Conda-based package and project manager"
depends = ["curl"]
detect = { cmd = "pixi --version", version = 'pixi (\S+)' }
install = [{ run = "curl -fsSL https://pixi.sh/install.sh | PIXI_NO_PATH_UPDATE=1 bash", update = "pixi self-update", latest = { http = "https://api.github.com/repos/prefix-dev/pixi/releases/latest", json = "tag_name" } }]
shell = { path = ["~/.pixi/bin"], init = { zsh = 'eval "$(pixi completion --shell zsh)"', bash = 'eval "$(pixi completion --shell bash)"' } }

[configs.pixi-config]
desc = "Keep the shell prompt unchanged in pixi shells"
depends = ["pixi"]
steps = [{ use = "toml-set", file = "~/.config/pixi/config.toml", key = "shell.change-ps1", value = false }]

[tools.bun]
desc = "JavaScript runtime, bundler and package manager"
depends = ["unzip", "curl"]
bins = ["bun", "bunx"]
detect = { cmd = "bun --version", version = '(\S+)' }
# Raw form: SHELL=/bin/sh stops the vendor script from appending to ~/.zshrc / ~/.bashrc;
# envira renders the PATH and completions itself (see `shell`).
install = [{ run = "curl -fsSL https://bun.sh/install | SHELL=/bin/sh bash", update = "bun upgrade", latest = { http = "https://api.github.com/repos/oven-sh/bun/releases/latest", json = "tag_name" } }]
shell = { path = ["~/.bun/bin"], env = { BUN_INSTALL = "~/.bun" }, init = { zsh = '[ -s "$HOME/.bun/_bun" ] && . "$HOME/.bun/_bun"' } }

[bundles.toolchains]
name = "Toolchains"
desc = "Rust, Go, Node.js, Python and JavaScript toolchains"
items = [
  "rust-toolchain", "cargo-binstall", "cargo-cache", "go", "fnm", "libatomic", "nodejs",
  "npm-prefix", "pm2", "pipx", "uv", "pixi", "pixi-config", "bun",
]
