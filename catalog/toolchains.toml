#:schema ./schema.json
# Language toolchains and runtimes. Other items depend on these explicitly.

[tools.rust-toolchain]
desc = "Rust toolchain via rustup (rustc, cargo)"
bins = ["rustup", "rustc", "cargo"]
detect = { cmd = "rustc --version", version = 'rustc (\S+)' }
install = [
  { method = "script", url = "https://sh.rustup.rs", args = ["-y", "--no-modify-path"] },
]
shell = { path = ["~/.cargo/bin"] }

[tools.unzip]
desc = "Extract zip archives (needed by the fnm and bun install scripts)"
detect = { cmd = "unzip -v", version = 'UnZip (\S+)' }
install = [
  { method = "apt", package = "unzip" },
  { method = "dnf", package = "unzip" },
  { method = "pacman", package = "unzip" },
  { method = "zypper", package = "unzip" },
]

[tools.fnm]
desc = "Fast Node.js version manager"
depends = ["unzip"]
detect = { cmd = "fnm --version", version = 'fnm (\S+)' }
install = [
  { method = "script", url = "https://fnm.vercel.app/install", shell = "bash", args = ["--skip-shell"] },
]
shell = { path = ["~/.local/share/fnm"], init = { zsh = 'eval "$(fnm env --use-on-cd --shell zsh)"', bash = 'eval "$(fnm env --use-on-cd --shell bash)"' } }

[tools.libatomic]
desc = "GNU atomic operations library (Node.js 25+ links against it)"
# A shared library, not an executable: detected through the linker cache.
bins = []
detect = { cmd = "PATH=\"$PATH:/sbin:/usr/sbin\" ldconfig -p | grep -qF libatomic.so.1" }
install = [
  { method = "apt", package = "libatomic1" },
  { method = "dnf", package = "libatomic" },
  { method = "pacman", package = "gcc-libs" },
  { method = "zypper", package = "libatomic1" },
]

[tools.nodejs]
desc = "Node.js LTS managed by fnm (default alias)"
bin = "node"
bins = ["node", "npm"]
depends = ["fnm", "libatomic"]
detect = { cmd = "node --version", version = 'v(\S+)' }
install = [{ run = "fnm install --lts && fnm default lts-latest" }]

[tools.pipx]
desc = "Install Python applications in isolated environments"
detect = { cmd = "pipx --version", version = '(\S+)' }
install = [
  { method = "apt", package = "pipx" },
  { method = "dnf", package = "pipx" },
  { method = "pacman", package = "python-pipx" },
  { method = "github-release", repo = "pypa/pipx", asset = "pipx.pyz" },
]

[tools.bun]
desc = "JavaScript runtime, bundler and package manager"
depends = ["unzip"]
bins = ["bun", "bunx"]
detect = { cmd = "bun --version", version = '(\S+)' }
# Raw form: SHELL=/bin/sh stops the vendor script from appending to ~/.zshrc / ~/.bashrc;
# envira renders the PATH and completions itself (see `shell`).
install = [{ run = "curl -fsSL https://bun.sh/install | SHELL=/bin/sh bash" }]
shell = { path = ["~/.bun/bin"], env = { BUN_INSTALL = "~/.bun" }, init = { zsh = '[ -s "$HOME/.bun/_bun" ] && . "$HOME/.bun/_bun"' } }

[bundles.toolchains]
name = "Toolchains"
desc = "Language toolchains other tools build on"
items = ["unzip", "libatomic", "rust-toolchain", "fnm", "nodejs", "pipx", "bun"]
