#:schema ./schema.json
# Distribution packages from the package-manager lines of run.sh. Each item lists the packages
# run.sh installs for it per family; a family run.sh does not cover has no entry.

[tools.homebrew]
desc = "Homebrew, the package manager the macOS routes use"
when = ["os:macos"]
bin = "brew"
detect = { cmd = "brew --version", version = 'Homebrew (\S+)' }
# The installer asks for sudo itself (to create /opt/homebrew) and refuses to run as root;
# `sudo -n true` makes envira ask for the password first and fails fast without sudo.
install = [{ run = "sudo -n true && NONINTERACTIVE=1 /bin/bash -c \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)\"", scope = "system", update = "brew update" }]
shell = { path = ["/opt/homebrew/bin", "/opt/homebrew/sbin"] }

[tools.git]
desc = "Version control"
install = [
  { method = "brew", package = "git", depends = ["homebrew"] },
  { method = "apt", package = "git" },
  { method = "dnf", package = "git" },
  { method = "pacman", package = "git" },
  { method = "zypper", package = "git" },
]

[tools.git-lfs]
desc = "Large file support for git"
detect = { cmd = "git-lfs --version", version = 'git-lfs/(\S+)' }
install = [
  { method = "brew", package = "git-lfs", depends = ["homebrew"] },
  { method = "apt", package = "git-lfs" },
  { method = "dnf", package = "git-lfs" },
  { method = "pacman", package = "git-lfs" },
  { method = "zypper", package = "git-lfs" },
]

[tools.curl]
desc = "HTTP client"
install = [
  { method = "apt", package = "curl" },
  { method = "dnf", package = "curl" },
  { method = "pacman", package = "curl" },
  { method = "zypper", package = "curl" },
]

[tools.wget]
desc = "HTTP/FTP downloader"
install = [
  { method = "brew", package = "wget", depends = ["homebrew"] },
  { method = "apt", package = "wget" },
  { method = "dnf", package = "wget" },
  { method = "pacman", package = "wget" },
  { method = "zypper", package = "wget" },
]

[tools.zsh]
desc = "Z shell"
install = [
  { method = "apt", package = "zsh" },
  { method = "dnf", package = "zsh" },
  { method = "pacman", package = "zsh" },
  { method = "zypper", package = "zsh" },
]

[tools.vim]
desc = "Vi IMproved"
detect = { cmd = "vim --version", version = 'Vi IMproved (\d+\.\d+)' }
install = [
  { method = "apt", package = "vim" },
  { method = "dnf", package = "vim" },
  { method = "pacman", package = "vim" },
  { method = "zypper", package = "vim" },
]

[tools.tmux]
desc = "Terminal multiplexer"
detect = { cmd = "tmux -V", version = 'tmux (\S+)' }
install = [
  { method = "brew", package = "tmux", depends = ["homebrew"] },
  { method = "apt", package = "tmux" },
  { method = "dnf", package = "tmux" },
  { method = "pacman", package = "tmux" },
  { method = "zypper", package = "tmux" },
]

[tools.screen]
desc = "GNU Screen terminal multiplexer"
# `screen -v` exits non-zero on some versions.
detect = { cmd = "(screen -v || true) 2>&1 | grep 'Screen version'" }
install = [
  { method = "apt", package = "screen" },
  { method = "dnf", package = "screen" },
  { method = "pacman", package = "screen" },
  { method = "zypper", package = "screen" },
]

[tools.build-tools]
desc = "C compiler, make and perl (building crates and sources)"
bins = ["gcc", "make", "perl"]
detect = { cmd = "gcc --version && make --version >/dev/null && perl -v >/dev/null", version = 'gcc \S+ (?:\([^)]*\) )?(\S+)' }
install = [
  { method = "apt", package = ["build-essential", "gcc", "make", "perl"] },
  { method = "dnf", package = ["gcc", "make", "perl"] },
  { method = "pacman", package = ["base-devel", "binutils", "gcc", "make", "perl"] },
  { method = "zypper", package = ["gcc", "make", "perl"] },
]

[tools.python3]
desc = "Python 3 with pip and venv"
detect = { cmd = "python3 --version && python3 -m pip --version >/dev/null", version = 'Python (\S+)' }
install = [
  # `python3` first: its version is the one reported.
  { method = "apt", package = ["python3", "python3-venv", "python3-pip"] },
  # Headers too, for pipx tools that build a C extension (archey4's netifaces); Ubuntu's python3-pip
  # recommends python3-dev, Arch's python ships them. openSUSE splits curses out (nvitop).
  { method = "dnf", package = ["python3", "python3-pip", "python3-devel"] },
  { method = "pacman", package = "python-pip" },
  { method = "zypper", package = ["python3", "python3-pip", "python3-devel", "python3-curses"] },
]

[tools.unzip]
desc = "Extract zip archives (needed by the fnm and bun install scripts)"
detect = { cmd = "unzip -v", version = 'UnZip (\S+)' }
install = [
  { method = "apt", package = "unzip" },
  { method = "dnf", package = "unzip" },
  { method = "pacman", package = "unzip" },
  { method = "zypper", package = "unzip" },
]

[tools.p7zip]
desc = "7-Zip archiver"
bin = "7z"
detect = { cmd = "7z i 2>&1 | grep '7-Zip'" }
install = [
  { method = "brew", package = "p7zip", depends = ["homebrew"] },
  { method = "apt", package = "p7zip-full" },
  # Fedora, Arch and openSUSE replaced p7zip with 7zip, which also ships `7z`.
  { method = "dnf", package = "7zip" },
  { method = "pacman", package = "7zip" },
  { method = "zypper", package = "7zip" },
]

[tools.xsel]
desc = "X selection (clipboard) command line tool"
detect = { cmd = "command -v xsel" }
install = [
  { method = "apt", package = "xsel" },
  { method = "dnf", package = "xsel" },
  { method = "pacman", package = "xsel" },
  { method = "zypper", package = "xsel" },
]

[tools.mosh]
desc = "Mobile shell (roaming SSH)"
install = [
  { method = "brew", package = "mosh", depends = ["homebrew"] },
  { method = "apt", package = "mosh" },
  { method = "dnf", package = "mosh" },
  { method = "pacman", package = "mosh" },
  { method = "zypper", package = "mosh" },
]

[tools.nmap]
desc = "Network scanner"
install = [
  { method = "brew", package = "nmap", depends = ["homebrew"] },
  { method = "apt", package = "nmap" },
  { method = "dnf", package = "nmap" },
  { method = "pacman", package = "nmap" },
  { method = "zypper", package = "nmap" },
]

[tools.iperf3]
desc = "Network bandwidth measurement"
install = [
  { method = "brew", package = "iperf3", depends = ["homebrew"] },
  { method = "dnf", package = "iperf3" },
  { method = "pacman", package = "iperf3" },
  { method = "zypper", package = "iperf" },
]

[tools.iputils-ping]
desc = "ping"
bin = "ping"
detect = { cmd = "ping -V" }
install = [
  { method = "apt", package = "iputils-ping" },
  { method = "dnf", package = "iputils" },
  { method = "pacman", package = "iputils" },
  { method = "zypper", package = "iputils" },
]

[tools.net-tools]
desc = "ifconfig, netstat, route"
bin = "ifconfig"
bins = ["ifconfig", "netstat"]
detect = { cmd = "PATH=\"$PATH:/sbin:/usr/sbin\" netstat --version 2>&1 | grep net-tools" }
install = [
  { method = "apt", package = "net-tools" },
  { method = "dnf", package = "net-tools" },
  { method = "pacman", package = "net-tools" },
  # openSUSE's net-tools has no netstat/ifconfig any more.
  { method = "zypper", package = "net-tools-deprecated" },
]

[tools.pciutils]
desc = "lspci (PCI device listing)"
bin = "lspci"
detect = { cmd = "PATH=\"$PATH:/sbin:/usr/sbin\" lspci --version" }
install = [
  { method = "apt", package = "pciutils" },
  { method = "dnf", package = "pciutils" },
  { method = "pacman", package = "pciutils" },
  { method = "zypper", package = "pciutils" },
]

[tools.openssh-server]
desc = "SSH server"
bin = "sshd"
detect = { cmd = "PATH=\"$PATH:/sbin:/usr/sbin\" command -v sshd" }
install = [
  { method = "apt", package = "openssh-server" },
  { method = "dnf", package = "openssh-server" },
  { method = "pacman", package = "openssh" },
  { method = "zypper", package = "openssh-server" },
]

[tools.libfuse2]
when = ["os:linux"]
desc = "FUSE 2 library (AppImages)"
bins = []
detect = { cmd = "PATH=\"$PATH:/sbin:/usr/sbin\" ldconfig -p | grep -F libfuse.so.2 >/dev/null" }
install = [
  { method = "apt", package = "libfuse2" },
  { method = "dnf", package = "fuse-libs" },
  { method = "pacman", package = "fuse2" },
  { method = "zypper", package = "libfuse2" },
]

[tools.fontconfig]
desc = "Font configuration and fc-cache"
bin = "fc-cache"
detect = { cmd = "fc-cache --version 2>&1" }
install = [
  { method = "apt", package = "fontconfig" },
  { method = "dnf", package = "fontconfig" },
  { method = "pacman", package = "fontconfig" },
  { method = "zypper", package = "fontconfig" },
]

[tools.apt-tools]
desc = "apt-utils and add-apt-repository"
when = ["family:debian"]
bin = "add-apt-repository"
detect = { cmd = "command -v add-apt-repository" }
install = [{ method = "apt", package = ["apt-utils", "software-properties-common"] }]

[tools.yay]
desc = "AUR helper"
when = ["family:arch"]
install = [
  # Manjaro ships yay in its repositories; Arch builds it from the AUR (makepkg asks sudo itself).
  { method = "pacman", package = "yay", when = ["distro:manjaro"] },
  { run = "git clone https://aur.archlinux.org/yay.git && cd yay && makepkg -si --noconfirm", when = ["distro:arch"], depends = ["git", "build-tools"] },
]

[bundles.base]
name = "Base"
desc = "Distribution packages every machine gets"
items = [
  "homebrew", "git", "git-lfs", "curl", "wget", "zsh", "vim", "tmux", "screen", "build-tools", "python3",
  "unzip", "p7zip", "xsel", "mosh", "nmap", "iperf3", "iputils-ping", "net-tools", "pciutils",
  "openssh-server", "libfuse2", "fontconfig", "apt-tools", "yay",
]
