#:schema ./schema.json
# Kernel and system settings.

[configs.inotify-watches]
desc = "Raise the inotify watch limit (editors, file watchers)"
scope = "system"
when = ["os:linux", "!container"]
steps = [
  { use = "line", file = "/etc/sysctl.conf", match = '^fs\.inotify\.max_user_watches=', line = "fs.inotify.max_user_watches=524288" },
  # Also for the running kernel.
  { check = '[ "$(cat /proc/sys/fs/inotify/max_user_watches)" -ge 524288 ]', run = "{sudo} sysctl -w fs.inotify.max_user_watches=524288" },
]

[bundles.system]
name = "System"
desc = "Kernel and system settings"
items = ["inotify-watches"]
