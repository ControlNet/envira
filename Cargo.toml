[package]
name = "envira"
version = "0.1.0"
edition = "2024"
description = "Install, update and track a Linux toolset from a declarative TOML catalog"
license = "AGPL-3.0-only"
repository = "https://github.com/ControlNet/envira"
rust-version = "1.93"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
flate2 = "1.1.10"
futures = "0.3.34"
include_dir = "0.7.4"
libc = "0.2.191"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "sync", "time", "macros", "io-util", "signal"] }
toml = "1.1.8"
toml_edit = "0.25.17"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true
