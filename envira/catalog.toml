[configs.bat-link]
desc = "`bat` name for Debian's batcat"
category = "terminal"
depends = ["bat"]
when = ["family:debian"]
scope = "system"

[[configs.bat-link.steps]]
use = "link"
link = "/usr/local/bin/bat"
target = "/usr/bin/batcat"

[configs.codex-sandbox-network]
desc = "Allow network access in the codex workspace-write sandbox"
category = "ai-agents"
depends = ["codex"]
when = []

[[configs.codex-sandbox-network.steps]]
use = "toml-set"
file = "~/.codex/config.toml"
key = "sandbox_workspace_write.network_access"
value = true

[configs.conda-settings]
desc = "Hide the conda environment prefix in the prompt"
category = "data-science"
depends = ["miniconda"]
when = []

[[configs.conda-settings.steps]]
use = "line"
file = "~/.condarc"
line = "changeps1: false"
match = "^changeps1:"

[configs.default-shell]
desc = "zsh as the login shell"
category = "shell"
depends = ["zsh"]
when = ["os:linux"]
scope = "system"
steps = []
check = 'case "$(getent passwd {user} | cut -d: -f7)" in */zsh) true ;; *) false ;; esac'
apply = '{sudo} usermod --shell "$(z=$(command -v zsh); grep -qx "$z" /etc/shells || z=$(grep -m1 "/zsh$" /etc/shells || echo "$z"); echo "$z")" {user}'
revert = "{sudo} usermod --shell /bin/bash {user}"

[configs.docker-group]
desc = "Run docker without sudo (takes effect at next login)"
category = "containers"
depends = ["docker"]
when = ["os:linux"]
scope = "system"

[[configs.docker-group.steps]]
use = "user-group"
group = "docker"

[configs.docker-service]
desc = "Start the docker daemon at boot (Arch, openSUSE; get.docker.com enables it elsewhere)"
category = "containers"
depends = ["docker"]
when = [
    "os:linux",
    "!family:debian",
    "!family:fedora",
    "!container",
]
scope = "system"
steps = []
check = "systemctl is-enabled --quiet docker"
apply = "{sudo} systemctl enable --now docker"
revert = "{sudo} systemctl disable --now docker"

[configs.git-settings]
desc = "git lsd alias (graph log) and the store credential helper"
category = "shell"
depends = ["git"]
when = []

[[configs.git-settings.steps]]
use = "ini-set"
file = "~/.gitconfig"
key = "lsd"
section = "alias"
value = "log --graph --decorate --pretty=oneline --abbrev-commit --all"

[[configs.git-settings.steps]]
use = "ini-set"
file = "~/.gitconfig"
key = "helper"
section = "credential"
value = "store"

[configs.ienv]
desc = "ienv helper: load Infisical secrets into the shell"
category = "secrets"
depends = [
    "infisical",
    "curl",
]
when = []
steps = []
check = 'test -s "$HOME/.local/share/infisical/ienv.sh"'
apply = 'mkdir -p "$HOME/.local/share/infisical" && chmod 700 "$HOME/.local/share/infisical" && curl -fsSL https://raw.githubusercontent.com/ControlNet/my-zsh-theme-env/main/files/ienv.sh -o "$HOME/.local/share/infisical/ienv.sh" && chmod 600 "$HOME/.local/share/infisical/ienv.sh"'
revert = 'rm -f "$HOME/.local/share/infisical/ienv.sh"'

[configs.inotify-watches]
desc = "Raise the inotify watch limit (editors, file watchers)"
category = "system"
depends = []
when = [
    "os:linux",
    "!container",
]
scope = "system"

[[configs.inotify-watches.steps]]
use = "line"
file = "/etc/sysctl.conf"
line = "fs.inotify.max_user_watches=524288"
match = '^fs\.inotify\.max_user_watches='

[[configs.inotify-watches.steps]]
check = '[ "$(cat /proc/sys/fs/inotify/max_user_watches)" -ge 524288 ]'
run = "{sudo} sysctl -w fs.inotify.max_user_watches=524288"

[configs.npm-prefix]
desc = "Global npm packages in ~/.local (bins in ~/.local/bin, independent of the Node version)"
category = "toolchains"
depends = ["nodejs"]
when = []

[[configs.npm-prefix.steps]]
use = "ini-set"
file = "~/.npmrc"
key = "prefix"
section = ""
value = "{home}/.local"

[configs.oh-my-opencode]
desc = "oh-my-opencode plugin for opencode (no provider logins)"
category = "ai-agents"
depends = [
    "opencode",
    "bun",
]
when = []
steps = []
check = """grep -qsE 'oh-my-(opencode|openagent)' "$HOME/.config/opencode/opencode.json" "$HOME/.config/opencode/opencode.jsonc""""
apply = "bunx oh-my-opencode install --no-tui --claude=no --openai=no --gemini=no --copilot=no"

[configs.pixi-config]
desc = "Keep the shell prompt unchanged in pixi shells"
category = "toolchains"
depends = ["pixi"]
when = []

[[configs.pixi-config.steps]]
use = "toml-set"
file = "~/.config/pixi/config.toml"
key = "shell.change-ps1"
value = false

[configs.superfile-config]
desc = "superfile default config without update checks"
category = "terminal"
depends = [
    "superfile",
    "curl",
]
when = []

[[configs.superfile-config.steps]]
check = 'test -f "$HOME/.config/superfile/config.toml"'
run = 'mkdir -p "$HOME/.config/superfile" && curl -fsSL https://raw.githubusercontent.com/yorukot/superfile/main/src/superfile_config/config.toml -o "$HOME/.config/superfile/config.toml"'

[[configs.superfile-config.steps]]
use = "toml-set"
file = "~/.config/superfile/config.toml"
key = "auto_check_update"
value = false

[configs.tmux-colors]
desc = "tmux 256-colour terminal"
category = "shell"
depends = []
when = []

[[configs.tmux-colors.steps]]
use = "block"
block = "tmux-colors"
content = """
set -g default-terminal "screen-256color"
"""
path = "~/.tmux.conf"

[configs.yazi-theme]
desc = "yazi onedark flavor"
category = "terminal"
depends = [
    "yazi",
    "git",
]
when = []

[[configs.yazi-theme.steps]]
check = 'test -d "$HOME/.config/yazi/flavors/onedark.yazi"'
run = "ya pkg add damjee/onedark"

[[configs.yazi-theme.steps]]
use = "toml-set"
file = "~/.config/yazi/theme.toml"
key = "flavor.dark"
value = "onedark"

[configs.zellij-config]
desc = "zellij starts locked, Ctrl-b passes through to tmux (fix_zellij_kdl.py)"
category = "terminal"
depends = [
    "zellij",
    "python3",
    "curl",
]
when = []
steps = []
check = """grep -Eq '^[[:space:]]*default_mode[[:space:]]+"locked"' "$HOME/.config/zellij/config.kdl""""
apply = "curl -fsSL https://raw.githubusercontent.com/ControlNet/envira/master/files/fix_zellij_kdl.py | python3"

[configs.zsh-plugins]
desc = "Enable git, zsh-autosuggestions and zsh-syntax-highlighting"
category = "shell"
depends = [
    "zsh-autosuggestions",
    "zsh-syntax-highlighting",
]
when = []

[[configs.zsh-plugins.steps]]
use = "line"
file = "~/.zshrc"
line = "plugins=(git zsh-autosuggestions zsh-syntax-highlighting)"
match = '^plugins=\('

[configs.zsh-settings]
desc = "Update oh-my-zsh without prompting; TERM=xterm-256color for tmux and mosh"
category = "shell"
depends = ["oh-my-zsh"]
when = []

[[configs.zsh-settings.steps]]
use = "line"
after = "^export ZSH="
file = "~/.zshrc"
line = "export DISABLE_UPDATE_PROMPT=true"
match = "^export DISABLE_UPDATE_PROMPT="

[[configs.zsh-settings.steps]]
use = "line"
after = "^export ZSH="
file = "~/.zshrc"
line = "export TERM=xterm-256color"
match = "^export TERM="

[configs.zsh-theme]
desc = "mzz-ys oh-my-zsh theme (ZSH_THEME, ZSH_DISABLE_COMPFIX)"
category = "shell"
depends = [
    "oh-my-zsh",
    "curl",
]
when = []

[[configs.zsh-theme.steps]]
check = 'test -s "$HOME/.oh-my-zsh/themes/mzz-ys.zsh-theme"'
run = 'curl -fsSL https://raw.githubusercontent.com/ControlNet/my-zsh-theme-env/main/files/mzz-ys.zsh-theme -o "$HOME/.oh-my-zsh/themes/mzz-ys.zsh-theme"'
revert = 'rm -f "$HOME/.oh-my-zsh/themes/mzz-ys.zsh-theme"'

[[configs.zsh-theme.steps]]
use = "line"
file = "~/.zshrc"
line = 'ZSH_THEME="mzz-ys"'
match = "^ZSH_THEME="

[[configs.zsh-theme.steps]]
use = "line"
after = "^ZSH_THEME="
file = "~/.zshrc"
line = 'ZSH_DISABLE_COMPFIX="true"'
match = "^ZSH_DISABLE_COMPFIX="

