# Generated by `envira catalog show` from catalog/*.toml; edit those instead.
schema = 1
min_envira = "0.1.0"

[env]
path = [
    "~/.local/bin",
    "~/.cargo/bin",
    "~/go/bin",
    "~/.go/bin",
    "~/.fzf/bin",
    "~/.local/share/fnm",
    "~/.local/share/fnm/aliases/default/bin",
    "~/.pixi/bin",
    "~/.bun/bin",
    "~/.opencode/bin",
    "~/.nvim/bin",
    "/opt/homebrew/bin",
    "/opt/homebrew/sbin",
    "~/Library/Application Support/fnm/aliases/default/bin",
]
shell_path = ["~/.local/bin"]

[env.bin_dir]
user = "~/.local/bin"
system = "/usr/local/bin"

[methods.apt]
desc = "Debian/Ubuntu package"
when = ["family:debian"]
scope = "system"
expects = []
install = "{sudo} {envira} apt-refresh && { {sudo} env DEBIAN_FRONTEND=noninteractive apt-get install -y {package} || { {sudo} apt-get update && {sudo} env DEBIAN_FRONTEND=noninteractive apt-get install -y {package}; }; }"
update = "{sudo} {envira} apt-refresh && {sudo} env DEBIAN_FRONTEND=noninteractive apt-get install --only-upgrade -y {package}"

[methods.apt.defaults]

[methods.apt.installed]
cmd = '''dpkg-query -W -f='${Version}\n' {package}'''
regex = '^(?:\d+:)?([^-\s]+)'

[methods.apt.latest]
cmd = "apt-cache policy {package}"
regex = 'Candidate: (?:\d+:)?([^-\s]+)'

[methods.brew]
desc = "Homebrew formula (macOS)"
when = ["os:macos"]
scope = "user"
expects = ["homebrew"]
install = "HOMEBREW_NO_ENV_HINTS=1 brew install {package}"
update = "HOMEBREW_NO_ENV_HINTS=1 brew upgrade {package}"

[methods.brew.defaults]

[methods.brew.installed]
cmd = 'ls "$(brew --prefix)/Cellar/{package}"'
regex = '^([^_\s]+)'

[methods.brew.latest]
http = "https://formulae.brew.sh/api/formula/{package}.json"
json = "versions.stable"

[methods.cargo]
desc = "Rust crate (prebuilt via cargo-binstall when available)"
when = []
scope = "user"
expects = ["rust-toolchain"]
install = "if command -v cargo-binstall >/dev/null 2>&1; then BINSTALL_DISABLE_TELEMETRY=true cargo binstall -y --force {package}; else cargo install --locked --force {package}; fi"

[methods.cargo.defaults]

[methods.cargo.installed]
cmd = "cargo install --list"
regex = '(?m)^{package} v(\S+):'

[methods.cargo.latest]
http = "https://crates.io/api/v1/crates/{package}"
json = "crate.max_stable_version"

[methods.dnf]
desc = "Fedora/RHEL package"
when = ["family:fedora"]
scope = "system"
expects = []
install = "{sudo} dnf install -y {package}"
update = "{sudo} dnf upgrade -y {package}"

[methods.dnf.defaults]

[methods.dnf.installed]
cmd = '''rpm -q --qf '%{{VERSION}}\n' {package}'''
regex = '^(\S+)'

[methods.dnf.latest]
cmd = '''dnf -q -C repoquery --latest-limit=1 --qf '%{{version}}\n' {package}'''
regex = '^(\S+)'

[methods.file]
desc = "Copy a local binary (self-built tools in a local overlay)"
when = []
scope = "any"
expects = []
install = "{sudo} install -D -m 755 {source} {bin_dir}/{bin}"

[methods.file.defaults]

[methods.github-release]
desc = "Prebuilt binary from a GitHub release"
when = []
scope = "any"
expects = []
install = "{envira} fetch-release --repo {repo} --asset {asset} --bin {bins} --to {bin_dir} --install-with '{sudo}'"

[methods.github-release.defaults]
bins = ["{bin}"]

[methods.github-release.latest]
http = "https://api.github.com/repos/{repo}/releases/latest"
json = "tag_name"

[methods.go]
desc = "Go module built with go install"
when = []
scope = "user"
expects = ["go"]
install = "go install {package}@latest"

[methods.go.defaults]

[methods.go.latest]
http = "https://proxy.golang.org/{package}/@latest"
json = "Version"

[methods.npm]
desc = "Global npm package"
when = []
scope = "user"
expects = ["nodejs"]
install = "npm install -g {package}"
update = "npm install -g {package}@latest"

[methods.npm.defaults]

[methods.npm.installed]
cmd = "npm ls -g --depth=0 {package}"
regex = '{package}@(\S+)'

[methods.npm.latest]
http = "https://registry.npmjs.org/{package}/latest"
json = "version"

[methods.pacman]
desc = "Arch package"
when = ["family:arch"]
scope = "system"
expects = []
install = "{sudo} pacman -S --needed --noconfirm {package} || {sudo} pacman -Syu --needed --noconfirm {package}"

[methods.pacman.defaults]

[methods.pacman.installed]
cmd = "pacman -Q {package}"
regex = '^\S+ (?:\d+:)?([^-\s]+)'

[methods.pacman.latest]
cmd = "pacman -Si {package}"
regex = 'Version\s*: (?:\d+:)?([^-\s]+)'

[methods.pipx]
desc = "Python application in an isolated venv"
when = []
scope = "user"
expects = ["pipx"]
install = "pipx install --force {package}"
update = "pipx upgrade {package}"

[methods.pipx.defaults]

[methods.pipx.installed]
cmd = "pipx list --short"
regex = '(?m)^{package} (\S+)'

[methods.pipx.latest]
http = "https://pypi.org/pypi/{package}/json"
json = "info.version"

[methods.script]
desc = "Vendor install script fetched over HTTPS"
when = []
scope = "user"
expects = ["curl"]
install = "curl -fsSL {url} | {sudo} {shell} -s -- {args}"

[methods.script.defaults]
args = []
shell = "sh"

[methods.zypper]
desc = "openSUSE package"
when = ["family:suse"]
scope = "system"
expects = []
install = "{sudo} zypper --non-interactive install {package}"
update = "{sudo} zypper --non-interactive update {package}"

[methods.zypper.defaults]

[methods.zypper.installed]
cmd = '''rpm -q --qf '%{{VERSION}}\n' {package}'''
regex = '^(\S+)'

[methods.zypper.latest]
cmd = "zypper -n --no-refresh info {package}"
regex = 'Version\s*:\s*(?:\d+:)?([^-\s]+)'

[actions.block]
desc = "Marked block inside a file (rc files, config fragments)"
check = "{sudo} {envira} fs block --check {path} --id {block} --comment {comment} --content {content}"
apply = "{sudo} {envira} fs block {path} --id {block} --comment {comment} --content {content}"
revert = "{sudo} {envira} fs block --remove {path} --id {block} --comment {comment}"

[actions.block.defaults]
comment = "#"

[actions.file]
desc = "Whole file with fixed content"
check = "{sudo} {envira} fs write --check {path} --mode {mode} --content {content}"
apply = "{sudo} {envira} fs write {path} --mode {mode} --content {content}"
revert = "{sudo} {envira} fs restore {path}"

[actions.file.defaults]
mode = "644"

[actions.ini-set]
desc = "Set one key in an INI file section"
check = "{sudo} {envira} fs ini-set --check {file} {section} {key} {value}"
apply = "{sudo} {envira} fs ini-set {file} {section} {key} {value}"
revert = "{sudo} {envira} fs restore {file} --key {section}.{key}"

[actions.ini-set.defaults]

[actions.line]
desc = "One whole line found by a regex (shell rc settings owned by another tool)"
check = "{sudo} {envira} fs line --check {file} --match {match} --line {line} --after {after}"
apply = "{sudo} {envira} fs line {file} --match {match} --line {line} --after {after}"
revert = "{sudo} {envira} fs restore {file} --key {match}"

[actions.line.defaults]
after = ""

[actions.link]
desc = "Symbolic link"
check = "{sudo} {envira} fs link --check {target} {link}"
apply = "{sudo} {envira} fs link {target} {link}"
revert = "{sudo} {envira} fs restore {link}"

[actions.link.defaults]

[actions.toml-set]
desc = "Set one key in a TOML file, keeping the rest of the file"
check = "{sudo} {envira} fs toml-set --check {file} {key} {value}"
apply = "{sudo} {envira} fs toml-set {file} {key} {value}"
revert = "{sudo} {envira} fs restore {file} --key {key}"

[actions.toml-set.defaults]

[actions.user-group]
desc = "Supplementary group membership for the target user"
check = '''id -nG {user} | tr ' ' '\n' | grep -x {group} >/dev/null'''
apply = "{sudo} groupadd -f {group} && {sudo} usermod -aG {group} {user}"
revert = "{sudo} gpasswd -d {user} {group}"

[actions.user-group.defaults]

